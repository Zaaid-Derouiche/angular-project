<div
  class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-900 font-sans"
>
  <div
    class="w-full max-w-md bg-white rounded-3xl p-10 text-center shadow-2xl transition-all duration-300 hover:-translate-y-1 hover:shadow-indigo-500/20"
  >
    <!-- Icon -->
    <div
      class="w-20 h-20 mx-auto mb-6 flex items-center justify-center rounded-full bg-indigo-50 text-4xl"
    >
      👋
    </div>

    <!-- Subtitle -->
    <span class="text-xs font-extrabold tracking-[3px] text-indigo-600"> WELCOME BACK </span>

    <!-- Title -->
    <h1 class="mt-5 mb-3 text-3xl font-bold text-slate-800">
      Hello,
      <span class="text-indigo-600">
        {{ name || 'Invité' }}
      </span>
    </h1>

    <!-- Description -->
    <p class="text-sm leading-relaxed text-slate-500">
      Gérez votre profil et personnalisez votre expérience.
    </p>

    <!-- Status -->
    <div
      class="inline-flex items-center gap-2 mt-7 mb-8 px-4 py-3 rounded-full bg-emerald-50 text-emerald-700 text-xs font-semibold"
    >
      <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>

      Votre espace personnel est actif
    </div>

    <!-- Actions -->
    <div class="flex flex-col gap-4">
      <button
        class="w-full py-4 rounded-xl bg-gradient-to-r from-indigo-500 to-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-500/25 transition-all duration-300 hover:-translate-y-1 hover:shadow-indigo-500/40 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
        (click)="rename()"
        [disabled]="disabled"
      >
        ✏️ Renommer
      </button>

      <button
        class="w-full py-4 rounded-xl bg-rose-50 text-rose-600 font-bold text-sm transition-all duration-300 hover:bg-rose-100 hover:-translate-y-1"
        (click)="deleteName()"
        [disabled]="disabled"
      >
        🗑 Supprimer le nom
      </button>
    </div>
  </div>
</div>
